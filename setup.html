<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODE THINK · Firebase баптау</title><link rel="stylesheet" href="platform.css"></head>

<section class="card" style="margin-top:24px"><h2 id="materialsTitle"></h2><p id="materialsHint"></p><input id="materials" type="file" accept="application/json,.json"><p><button id="upload" class="primary" type="button"></button></p></section>

<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODE THINK · Идеяны таныстыру</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18304d;background:#f3f7fc;line-height:1.6}body{margin:0}main{max-width:1000px;margin:auto;padding:24px}header,section{background:white;border:1px solid #d7e2ef;border-radius:18px;padding:24px;margin-bottom:20px}h1,h2{line-height:1.25}h1{font-size:clamp(25px,4vw,38px)}h2{font-size:23px}a{color:#146bb5}button,input{font:inherit;border:1px solid #b6cbe0;border-radius:10px;padding:10px}button{cursor:pointer;background:#176bb4;color:white}button.secondary{color:#18304d;background:#eef5fc}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #e6a000;outline-offset:3px}.fields,.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}label{display:block}input{display:block;box-sizing:border-box;width:100%;margin-top:6px}input[type=text]{max-width:600px}.muted{color:#526b85}.value{background:#edf6ff;border-radius:12px;padding:16px}.value strong{display:block;font-size:24px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #d7e2ef;padding:12px;vertical-align:top}.notice{border-left:4px solid #167cb2;padding:14px;background:#edf6ff}summary{cursor:pointer;font-weight:650}.error{color:#a82237}output{display:block;font-weight:650;margin-top:18px}[hidden]{display:none!important}@media(max-width:620px){.fields,.values{grid-template-columns:1fr}main{padding:12px}header,section{padding:18px}table{font-size:14px}td,th{padding:7px}}@media print{button,.actions{display:none}main{max-width:none}section,header{break-inside:avoid}}
</style></head><body><main>
<header><a href="index.html">← CODE THINK</a><div class="actions"><button id="kk" type="button" aria-pressed="true">ҚАЗ</button><button id="ru" class="secondary" type="button" aria-pressed="false">РУС</button></div><p class="muted" data-kk="Педагогикалық идеяны таныстыруға арналған оқу көрсетілімі" data-ru="Учебная демонстрация педагогической идеи"></p><h1 data-kk="Болжа → тексер → түсіндір → жаңа жағдайда қолдан" data-ru="Предскажи → проверь → объясни → примени в новой ситуации"></h1><p data-kk="Мақсат — дайын жауапты көшіру емес, баға мен жеңілдіктің байланысын түсіндіру. Бұл бет оқушы аккаунтына кірмей таныстыруға арналған; мұнда бағалар мен прогресс сақталмайды." data-ru="Цель — объяснить связь цены и скидки. Страница служит для показа без входа в аккаунт ученика; оценки и прогресс здесь не сохраняются."></p></header>
<section><h2 data-kk="1. Аудитория алдымен болжам айтады" data-ru="1. Сначала аудитория делает прогноз"></h2><p data-kk="Тауар 1000 теңге тұрады. Жеңілдік 20%. Қолыңда 850 теңге бар. Ақша жете ме? Қанша қалады? Алдымен ауызша жауап пен оның себебін тыңда." data-ru="Товар стоит 1000 тенге. Скидка 20%. У тебя 850 тенге. Хватит ли денег? Сколько останется? Сначала выслушай ответ и его объяснение."></p><div class="fields"><label><span data-kk="Бастапқы баға, тг" data-ru="Исходная цена, тг"></span><input id="price" type="number" min="0" step="any" value="1000"></label><label><span data-kk="Жеңілдік, %" data-ru="Скидка, %"></span><input id="discount" type="number" min="0" max="100" step="any" value="20"></label><label><span data-kk="Қолдағы ақша, тг" data-ru="Бюджет, тг"></span><input id="budget" type="number" min="0" step="any" value="850"></label></div><p><label><span data-kk="Менің болжамым және себебі" data-ru="Мой прогноз и причина"></span><input id="prediction" type="text" maxlength="500"></label></p><button id="reveal" type="button" data-kk="Болжамды нәтижемен салыстыру" data-ru="Сравнить прогноз с результатом"></button><p id="error" class="error" role="alert"></p>
<div id="result" hidden><h3 data-kk="Шамалардың өзгерісі" data-ru="Изменение величин"></h3><div class="values"><div class="value"><span data-kk="Жеңілдік сомасы" data-ru="Сумма скидки"></span><strong id="saved"></strong></div><div class="value"><span data-kk="Соңғы баға" data-ru="Итоговая цена"></span><strong id="final"></strong></div><div class="value"><span data-kk="Қалған не жетпеген ақша" data-ru="Остаток или нехватка денег"></span><strong id="rest"></strong></div></div><output id="decision" aria-live="polite"></output><p id="comparison"></p><p class="notice" data-kk="Неге осылай шықты? Жеңілдік сомасын бағадан шегеріп, соңғы бағаны бюджетпен салыстыр. Бұл көрсетілімдегі есептеу — толық Python редакторындағы қадамдық визуализацияның қысқа түсіндірмесі." data-ru="Почему получился такой результат? Вычти сумму скидки из цены и сравни итог с бюджетом. Этот расчёт кратко поясняет пошаговую визуализацию в основном Python-редакторе."></p></div></section>
<section><h2 data-kk="2. Шекаралық жағдайды тексер" data-ru="2. Проверь граничные случаи"></h2><div class="actions"><button class="secondary" type="button" data-case="0" data-kk="0% жеңілдік" data-ru="Скидка 0%"></button><button class="secondary" type="button" data-case="100" data-kk="100% жеңілдік" data-ru="Скидка 100%"></button><button class="secondary" type="button" data-case="20" data-kk="20% жеңілдік" data-ru="Скидка 20%"></button></div><p data-kk="Әр өзгерістен кейін жаңа болжам айт. 0% кезінде баға сақталуы, 100% кезінде баға 0 болуы керек. Дәл соңғы бағаға тең ақша болса, қалдық неге 0?" data-ru="После каждого изменения сделай новый прогноз. При 0% цена сохраняется, при 100% становится нулевой. Почему остаток равен 0, если бюджет точно равен цене?"></p></section>
<section><h2 data-kk="3. Платформада көрсетудің реті" data-ru="3. Порядок показа на платформе"></h2><table><thead><tr><th data-kk="Кезең" data-ru="Этап"></th><th data-kk="Оқушының әрекеті және көрінетін дәлел" data-ru="Действие ученика и наблюдаемое свидетельство"></th></tr></thead><tbody>
<tr><td data-kk="Түсін" data-ru="Пойми"></td><td data-kk="Бастапқы баға мен пайызды ажыратады. Не табатынын өз сөзімен айтады." data-ru="Различает исходную цену и процент. Своими словами формулирует, что найти."></td></tr>
<tr><td data-kk="Жоспарла" data-ru="Спланируй"></td><td data-kk="Жеңілдік сомасы → соңғы баға ретін жазады. Қосымша жұмыста бюджетпен салыстыру қосылады." data-ru="Записывает порядок: сумма скидки → итоговая цена. В дополнительной работе добавляет сравнение с бюджетом."></td></tr>
<tr><td data-kk="Кодта" data-ru="Напиши код"></td><td data-kk="Python кодын өзі жазады. Оң жақтан айнымалы мәндері мен нәтижені бақылайды; блок-схема орындалу ретін көрсетеді." data-ru="Сам пишет Python-код. Справа наблюдает значения переменных и результат; блок-схема показывает порядок выполнения."></td></tr>
<tr><td data-kk="Тексер" data-ru="Проверь"></td><td data-kk="1000 және 20 үшін 800.00 күтеді. 0% және 100% жағдайларын тексереді, сәйкестік не айырманың себебін жазады." data-ru="Для 1000 и 20 ожидает 800.00. Проверяет 0% и 100%, объясняет совпадение или различие."></td></tr>
<tr><td data-kk="Түсіндір және қолдан" data-ru="Объясни и примени"></td><td data-kk="20% неліктен 20 теңге емес екенін түсіндіреді. Жаңа жағдайда 850 теңгенің жетуін, 50 теңгенің қалуын негіздейді." data-ru="Объясняет, почему 20% не означает 20 тенге. В новой ситуации обосновывает, что 850 тенге хватит и останется 50."></td></tr>
</tbody></table><p class="notice" data-kk="Платформадағы негізгі «Дүкендегі жеңілдік» есебі тек соңғы бағаны табады. Бюджетті салыстыру — одан кейінгі қосымша жұмыс, бұрынғы есепке қойылатын жаңа міндетті талап емес." data-ru="Основная задача «Скидка в магазине» вычисляет только итоговую цену. Сравнение с бюджетом — дополнительная работа, а не новое обязательное требование старой задачи."></p></section>
<section><h2 data-kk="4. Мұғалім не бағалайды?" data-ru="4. Что оценивает учитель?"></h2><ul><li data-kk="Дұрыс нәтиже мен оны дәлелдейтін алгоритм." data-ru="Верный результат и обосновывающий его алгоритм."></li><li data-kk="Болжам мен нақты нәтижені салыстыру, қате болса себебін табу." data-ru="Сравнение прогноза с результатом и поиск причины ошибки."></li><li data-kk="Жаңа есепке бейімдеу: көмексіз шешім мен түсіндіру." data-ru="Перенос на новую задачу: самостоятельное решение и объяснение."></li></ul><p data-kk="Көмексіз бастапқы болжам қажет болса, кодты жазар алдында «Тікелей көріністі» өшір. Оқу кезінде оны қайта қосуға болады. Көрсетілген мысал — оқу демонстрациясы; оқушылар жетістігінің зерттеу нәтижесі емес." data-ru="Если нужен исходный прогноз без помощи, отключи прямой предпросмотр до написания кода. В процессе обучения его можно включить. Пример — учебная демонстрация, а не результат исследования достижений учеников."></p><details><summary data-kk="Қорғауға арналған қысқа сценарий" data-ru="Краткий сценарий выступления"></summary><p data-kk="Мәселе: жұмыс істейтін код әрдайым түсінуді білдірмейді. Әдіс: оқушы болжайды, орындайды, түсіндіреді және жаңа жағдайда қолданады. Демонстрация: жеңілдік есебі, аудитория болжамы, визуализация, шекаралық тексеру. Дәлел: нақты оқушының анонимделген болжамы, түзетуі және түсіндіруі. Дерек жиналмаса, апробация жоспарын айт; нәтиже пайызын ойдан қоспа." data-ru="Проблема: работающий код ещё не доказывает понимание. Метод: ученик прогнозирует, выполняет, объясняет и применяет в новой ситуации. Показ: скидка, прогноз аудитории, визуализация, границы. Свидетельство: обезличенные прогноз, исправление и объяснение реального ученика. Если данных нет, представь план апробации без вымышленных процентов."></p></details><p><a href="teacher-guide.html" data-kk="Толық әдістемелік нұсқаулық →" data-ru="Полное методическое руководство →"></a></p></section>
</main><script>
'use strict';let lang='kk';const $=id=>document.getElementById(id);const text=(kk,ru)=>lang==='kk'?kk:ru;
function language(value){lang=value;document.documentElement.lang=value;document.querySelectorAll('[data-kk]').forEach(el=>el.textContent=el.dataset[value]);for(const id of ['kk','ru']){$(id).setAttribute('aria-pressed',String(id===value));$(id).className=id===value?'':'secondary';}invalidate();}
function invalidate(){$('result').hidden=true;$('error').textContent='';}
for(const id of ['price','discount','budget','prediction'])$(id).addEventListener('input',invalidate);
for(const id of ['kk','ru'])$(id).addEventListener('click',()=>language(id));
document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{$('discount').value=b.dataset.case;$('prediction').value='';invalidate();$('prediction').focus();}));
$('reveal').addEventListener('click',()=>{const vals=['price','discount','budget'].map(id=>$(id).value.trim());const [p,d,b]=vals.map(Number);if(vals.some(v=>!v)||![p,d,b].every(Number.isFinite)||p<0||b<0||d<0||d>100){$('error').textContent=text('Баға мен ақша ≥0, жеңілдік 0–100 болуы керек.','Цена и бюджет должны быть ≥0, скидка 0–100.');return;}if(!$('prediction').value.trim()){$('error').textContent=text('Алдымен болжамыңды жаз.','Сначала запиши свой прогноз.');return;}const saved=p*d/100,final=p-saved,rest=b-final;const money=n=>n.toFixed(2)+' '+text('тг','тг');$('saved').textContent=money(saved);$('final').textContent=money(final);$('rest').textContent=money(Math.abs(rest));$('decision').textContent=rest>=-1e-9?text('Ақша жетеді. Қалады: ','Денег хватает. Останется: ')+money(Math.max(0,rest)):text('Ақша жетпейді. Жетпейтін сома: ','Денег не хватает. Не хватает: ')+money(-rest);$('comparison').textContent=text('Сенің болжамың: ','Твой прогноз: ')+$('prediction').value.trim();$('error').textContent='';$('result').hidden=false;});language('kk');
</script></body></html>
